<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>建康城详图 · 台城围城关卡(548-549)</title>
<style>
body{background:#26221c;color:#e8ddc8;font-family:"Microsoft YaHei",sans-serif;margin:0;padding:20px;}
h1{font-size:20px;margin:0 0 4px;} .sub{color:#a89a7e;font-size:13px;margin-bottom:10px;}
.mapwrap{max-width:1000px;background:#efe6d0;border:1px solid #b7a888;border-radius:8px;padding:8px;}
svg{width:100%;height:auto;display:block;}
.note{font-size:12px;color:#8f8168;margin-top:10px;line-height:1.8;}
</style>
</head>
<body>
<h1>建康城详图 · 台城围城关卡(548.10–549.3)</h1>
<div class="sub">围城 130 天的空间件 · 城门/土山/水系/佛寺/坐标编号对应改写节点④⑤⑥</div>
<div class="mapwrap">
<svg viewBox="0 0 900 700">
<!-- 秦淮河 -->
<path d="M50,550 Q200,530 350,540 Q500,550 650,535 Q750,530 850,545" fill="none" stroke="#4f7fa8" stroke-width="8" opacity=".7"/>
<text x="60" y="570" font-size="14" fill="#3a6172">秦淮河(南)</text>
<!-- 朱雀航 -->
<line x1="430" y1="540" x2="430" y2="480" stroke="#8c6f4a" stroke-width="4" stroke-dasharray="8 4"/>
<text x="400" y="510" font-size="11" fill="#8c6f4a">朱雀航▲庾信弃军处</text>
<!-- 长江(顶部) -->
<path d="M50,60 Q300,45 550,55 Q700,60 850,50" fill="none" stroke="#4f7fa8" stroke-width="10" opacity=".6"/>
<text x="60" y="45" font-size="14" fill="#3a6172">长江(北)</text>
<!-- 玄武湖(右上) -->
<ellipse cx="700" cy="150" rx="100" ry="60" fill="#c9dbe4" stroke="#9db8c4" stroke-width="2"/>
<text x="670" y="155" font-size="13" fill="#3a6172">玄武湖</text>
<!-- 台城(中央核心) -->
<rect x="300" y="200" width="200" height="180" fill="#d4c9a8" stroke="#8c6f4a" stroke-width="4" rx="6"/>
<text x="350" y="230" font-size="18" font-weight="bold" fill="#4a3f2e">台 城</text>
<text x="315" y="255" font-size="11" fill="#6b5a3d">宫城·尚书台</text>
<text x="315" y="270" font-size="11" fill="#6b5a3d">围城130天</text>
<!-- 净居殿(武帝死处) -->
<rect x="420" y="280" width="60" height="40" fill="#c9a13b" opacity=".4" stroke="#a3822a" rx="3"/>
<text x="425" y="300" font-size="10" fill="#8c6b28">净居殿★④</text>
<!-- 太极殿 -->
<rect x="320" y="280" width="60" height="40" fill="#d4c9a8" stroke="#8c6f4a" rx="3"/>
<text x="322" y="300" font-size="10" fill="#6b5a3d">太极殿</text>
<!-- 东宫 -->
<rect x="530" y="210" width="80" height="60" fill="#d4c9a8" stroke="#8c6f4a" rx="3"/>
<text x="540" y="235" font-size="12" fill="#6b5a3d">东宫</text>
<text x="535" y="250" font-size="10" fill="#93866c">(焚)</text>
<!-- 东府城 -->
<rect x="530" y="380" width="100" height="80" fill="#c05a2e" opacity=".3" stroke="#9c4420" stroke-width="2" rx="3"/>
<text x="545" y="410" font-size="13" fill="#7a3418">东府城</text>
<text x="540" y="428" font-size="10" fill="#7a3418">屠二千人</text>
<!-- 石头城(西北角) -->
<rect x="150" y="100" width="80" height="60" fill="#7a4fa3" opacity=".3" stroke="#5d3b80" rx="3"/>
<text x="155" y="128" font-size="13" fill="#4a2f66">石头城</text>
<text x="150" y="145" font-size="10" fill="#5d3b80">侯景屯兵</text>
<!-- 白下(东北) -->
<rect x="550" y="100" width="60" height="40" fill="#d4c9a8" stroke="#8c6f4a" rx="3"/>
<text x="555" y="122" font-size="11" fill="#6b5a3d">白下▲</text>
<!-- 侯景土山(西+东) -->
<ellipse cx="260" cy="290" rx="40" ry="30" fill="#c1121f" opacity=".2" stroke="#c1121f" stroke-dasharray="5 3"/>
<text x="230" y="295" font-size="11" fill="#c1121f">侯景土山</text>
<ellipse cx="560" cy="290" rx="40" ry="30" fill="#c1121f" opacity=".2" stroke="#c1121f" stroke-dasharray="5 3"/>
<text x="535" y="295" font-size="11" fill="#c1121f">侯景土山</text>
<!-- 城内对策山 -->
<ellipse cx="340" cy="180" rx="25" ry="18" fill="#3d7d4f" opacity=".25" stroke="#2e6b3f" stroke-dasharray="5 3"/>
<ellipse cx="460" cy="180" rx="25" ry="18" fill="#3d7d4f" opacity=".25" stroke="#2e6b3f" stroke-dasharray="5 3"/>
<text x="330" y="170" font-size="10" fill="#2e6b3f">对策山</text>
<!-- 青塘(韦粲死处) -->
<circle cx="450" cy="480" r="8" fill="#c1121f" opacity=".5"/>
<text x="425" y="470" font-size="11" fill="#8c2f2a">青塘●⑤</text>
<!-- 城门标注 -->
<text x="280" y="195" font-size="10" fill="#6b5a3d">大司马门</text>
<text x="505" y="250" font-size="10" fill="#6b5a3d">东掖门</text>
<text x="280" y="390" font-size="10" fill="#6b5a3d">西华门(盟坛)</text>
<!-- 内应处(西北角) -->
<circle cx="300" cy="200" r="6" fill="#c1121f"/>
<text x="245" y="188" font-size="10" fill="#8c2f2a">▲⑥内应纳贼</text>
<!-- 建康外城(虚线) -->
<rect x="120" y="80" width="660" height="480" fill="none" stroke="#8c6f4a" stroke-width="2" stroke-dasharray="12 6" rx="10"/>
<text x="130" y="100" font-size="12" fill="#8c6f4a">建康都城(外城)</text>
<!-- 援军方向 -->
<path d="M800,200 Q700,220 650,250" fill="none" stroke="#2e6b3f" stroke-width="3" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2e6b3f"/></marker></defs>
<text x="720" y="190" font-size="11" fill="#2e6b3f">援军⑤(二十万·观望)</text>
<!-- 侯景进军箭头 -->
<path d="M100,600 Q300,580 420,540" fill="none" stroke="#c1121f" stroke-width="3" marker-end="url(#ar2)"/>
<defs><marker id="ar2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c1121f"/></marker></defs>
<text x="150" y="610" font-size="11" fill="#c1121f">侯景进军③(采石渡江)</text>
<!-- 佛寺标记 -->
<g font-size="12" fill="#1e5aa8">
<text x="200" y="350">卍 同泰寺</text>
<text x="600" y="170">卍 庄严寺</text>
</g>
<!-- 图例 -->
<g transform="translate(60,640)">
<rect x="-10" y="-15" width="380" height="60" rx="5" fill="#f5efe0" stroke="#b7a888" opacity=".95"/>
<text x="0" y="0" font-size="12" font-weight="bold" fill="#4a3f2e">图例</text>
<text x="0" y="18" font-size="10">●④⑤⑥=改写节点 | ★=志怪锚点 | ▲=名场面 | 卍=佛寺(超度)</text>
<text x="0" y="34" font-size="10">红色=侯景势力 | 绿色=梁军 | 紫色=西魏 | 虚线=城墙/水界</text>
</g>
</svg>
</div>
<div class="note">围城关卡核心循环:白天守墙(战斗)→夜间修城(资源消耗)→口粮递减(围城经济)→疫病随机蔓延→援军消息(假消息定期入城)。空间件:大司马门(正门)/东西掖门(攻防焦点)/东宫(焚)/石头城(侯景)/玄武湖(引水灌城)/朱雀航(庾信)/青塘(韦粲)/台城西北角(内应)。</div>
</body>
</html>
