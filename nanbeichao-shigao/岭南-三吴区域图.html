<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>岭南-湘赣-三吴 区域图(主角动线)</title>
<style>
body{background:#26221c;color:#e8ddc8;font-family:"Microsoft YaHei",sans-serif;margin:0;padding:20px;}
h1{font-size:20px;margin:0 0 4px;} .sub{color:#a89a7e;font-size:13px;margin-bottom:10px;}
.mapwrap{max-width:900px;background:#efe6d0;border:1px solid #b7a888;border-radius:8px;padding:8px;}
svg{width:100%;height:auto;display:block;}
.note{font-size:12px;color:#8f8168;margin-top:10px;line-height:1.8;}
</style>
</head>
<body>
<h1>岭南-湘赣-三吴 区域图(主角动线 547–557)</h1>
<div class="sub">序章(岭南教程)→北上(湘赣成长)→主舞台(三吴+建康)——三段地理节奏</div>
<div class="mapwrap">
<svg viewBox="0 0 700 900">
<!-- 底图:粗略海岸线 -->
<path d="M520,60 Q480,150 520,250 Q540,350 500,450 Q480,550 520,650 Q540,750 500,850" fill="#c9dbe4" stroke="none"/>
<path d="M520,60 Q480,150 520,250 Q540,350 500,450 Q480,550 520,650 Q540,750 500,850 L700,850 L700,60 Z" fill="#efe6d0" stroke="#8f8168" stroke-width="1.5"/>
<!-- 珠江水系 -->
<path d="M350,750 Q380,720 420,710 Q450,700 480,700" fill="none" stroke="#4f7fa8" stroke-width="4"/>
<path d="M300,700 Q330,680 370,670 Q400,660 430,660" fill="none" stroke="#4f7fa8" stroke-width="3"/>
<!-- 湘江 -->
<path d="M350,350 Q360,400 350,450 Q340,500 350,550 Q355,580 350,610" fill="none" stroke="#4f7fa8" stroke-width="3"/>
<text x="360" y="480" font-size="11" fill="#3a6172">湘江</text>
<!-- 赣江 -->
<path d="M420,280 Q425,330 420,380 Q415,430 420,480 Q422,510 420,540" fill="none" stroke="#4f7fa8" stroke-width="3"/>
<text x="432" y="400" font-size="11" fill="#3a6172">赣江</text>
<!-- 长江 -->
<path d="M450,120 Q400,130 350,125 Q300,120 250,130" fill="none" stroke="#4f7fa8" stroke-width="5"/>
<text x="260" y="112" font-size="14" fill="#3a6172">长江</text>
<!-- 区域分界 -->
<line x1="280" y1="630" x2="520" y2="630" stroke="#b7a888" stroke-width="2" stroke-dasharray="8 5"/>
<line x1="280" y1="280" x2="520" y2="280" stroke="#b7a888" stroke-width="2" stroke-dasharray="8 5"/>
<!-- 区域标签 -->
<text x="100" y="750" font-size="20" font-weight="bold" fill="#2e6b3f" opacity=".5">岭 南</text>
<text x="90" y="770" font-size="11" fill="#2e6b3f">序章·教程</text>
<text x="100" y="450" font-size="18" font-weight="bold" fill="#a3822a" opacity=".5">湘 赣</text>
<text x="90" y="470" font-size="11" fill="#a3822a">成长期</text>
<text x="120" y="180" font-size="18" font-weight="bold" fill="#7a3418" opacity=".5">三 吴</text>
<text x="110" y="200" font-size="11" fill="#7a3418">主舞台</text>
<!-- 城市标注 -->
<g font-size="12" fill="#4a3f2e">
<!-- 岭南区 -->
<circle cx="380" cy="770" r="4" fill="#2e6b3f"/>
<text x="392" y="775">番禺·广州(冼夫人/终点)</text>
<circle cx="310" cy="720" r="4" fill="#2e6b3f"/>
<text x="322" y="725">苍梧(序1/主角家)</text>
<circle cx="350" cy="680" r="4" fill="#2e6b3f"/>
<text x="362" y="685">高要(序3/陈霸先)</text>
<circle cx="410" cy="740" r="3" fill="#2e6b3f"/>
<text x="422" y="745">始兴</text>
<circle cx="440" cy="690" r="3" fill="#2e6b3f"/>
<text x="452" y="695">南康</text>
<!-- 湘赣区 -->
<circle cx="350" cy="580" r="4" fill="#a3822a"/>
<text x="362" y="585">巴陵(节点⑦/转折点)</text>
<circle cx="340" cy="520" r="3" fill="#a3822a"/>
<text x="352" y="525">长沙</text>
<circle cx="300" cy="420" r="4" fill="#a3822a"/>
<text x="312" y="425">江陵(节点⑧/焚书)</text>
<circle cx="420" cy="350" r="3" fill="#a3822a"/>
<text x="432" y="355">豫章</text>
<circle cx="400" cy="300" r="3" fill="#a3822a"/>
<text x="412" y="305">南康(蔡路养)</text>
<!-- 三吴区 -->
<circle cx="420" cy="160" r="5" fill="#7a3418"/>
<text x="432" y="165">建康·台城(主舞台)</text>
<circle cx="390" cy="180" r="3" fill="#7a3418"/>
<text x="402" y="185">姑孰</text>
<circle cx="370" cy="160" r="3" fill="#7a3418"/>
<text x="382" y="155">采石(节点③)</text>
<circle cx="460" cy="190" r="3" fill="#7a3418"/>
<text x="472" y="195">吴郡(⑥三吴)</text>
<circle cx="470" cy="215" r="3" fill="#7a3418"/>
<text x="482" y="220">会稽</text>
<circle cx="380" cy="210" r="3" fill="#7a3418"/>
<text x="392" y="215">义兴(节点⑤)</text>
</g>
<!-- 主角动线箭头 -->
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#e0362d"/></marker></defs>
<path d="M350,680 Q380,600 360,560 Q350,520 330,420 Q310,300 400,180" fill="none" stroke="#e0362d" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#ar)"/>
<text x="300" y="540" font-size="11" fill="#e0362d" font-weight="bold">主角动线(序章→围城)</text>
<!-- 改写节点标记 -->
<g font-size="11" fill="#8c2f2a" font-weight="bold">
<text x="380" y="690">①③</text>
<text x="365" y="570">⑦⑧</text>
<text x="395" y="150">②④⑤⑥⑨</text>
</g>
<!-- 图例 -->
<g transform="translate(50,850)">
<rect x="-10" y="-15" width="350" height="50" rx="5" fill="#f5efe0" stroke="#b7a888" opacity=".95"/>
<text x="0" y="0" font-size="12" font-weight="bold" fill="#4a3f2e">图例</text>
<text x="0" y="18" font-size="10">①-⑨=改写节点 | 绿=岭南 | 黄=湘赣 | 红=三吴 | 虚红=主角动线</text>
</g>
</svg>
</div>
<div class="note">地理节奏:岭南(饱和绿+暖金,巫鬼文化)→湘赣(过渡色,江湖气息)→三吴(雅致但暗红叠加,浩劫氛围)。主角从右下(苍梧)→中(江陵巴陵)→左上(建康),海拔/文化/剧情密度同步上升。</div>
</body>
</html>
